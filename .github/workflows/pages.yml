name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build static site
        run: npm run build:pages
      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          PUB=""
          for d in dist/client .output/public dist .vercel/output/static; do
            if [ -f "$d/index.html" ]; then PUB="$d"; break; fi
          done
          if [ -z "$PUB" ]; then
            echo "No index.html in known output dirs:"
            find . -name index.html -not -path './node_modules/*' | head
            ls -la .output .vercel/output dist 2>/dev/null || true
            exit 1
          fi
          echo "Using publish dir: $PUB"
          touch "$PUB/.nojekyll"
          cp "$PUB/index.html" "$PUB/404.html"
          echo "$PUB" > /tmp/pages-dir
          mkdir -p _site
          cp -a "$PUB"/. _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
